<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전략 컴파일러 데모</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px;
         margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin: 0 0 1rem; padding: 1rem; }
  label { display: block; margin: .75rem 0; }
  label > span { display: block; font-size: .85rem; opacity: .75; margin-bottom: .25rem; }
  select, input, textarea { width: 100%; padding: .5rem; font: inherit;
                            border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit; }
  button { padding: .6rem 1.4rem; font: inherit; font-weight: 600; border-radius: 6px;
           border: 0; background: #2563eb; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: progress; }
  pre { background: #8881; padding: 1rem; border-radius: 8px; overflow-x: auto; }
  .err { color: #dc2626; white-space: pre-wrap; }
  #chart { margin: 0 0 1rem; }
  #chart:empty { display: none; }
</style>
</head>
<body>
<h1>전략 컴파일러 데모</h1>

<form id="survey">
  <fieldset>
    <legend>설문</legend>

    <label><span>관심 섹터/테마</span>
      <select name="sector">
        <option>반도체</option><option>2차전지</option><option>배당</option>
        <option>대형주</option><option>코스닥</option><option>미국주식</option><option>채권</option>
      </select>
    </label>

    <label><span>투자 성향</span>
      <select name="risk">
        <option value="conservative">안정형</option>
        <option value="neutral" selected>중립형</option>
        <option value="aggressive">공격형</option>
      </select>
    </label>

    <label><span>감내 가능 손실</span>
      <select name="max_loss">
        <option value="3">3%</option>
        <option value="5" selected>5%</option>
        <option value="10">10%</option>
      </select>
    </label>

    <label><span>매매 스타일</span>
      <select name="style">
        <option>추세추종(모멘텀)</option><option>역추세</option><option>이평선 교차</option>
      </select>
    </label>

    <label><span>리밸런싱 주기</span>
      <select name="rebalance">
        <option value="weekly">주 1회</option>
        <option value="monthly" selected>월 1회</option>
        <option value="quarterly">분기 1회</option>
      </select>
    </label>

    <label><span>자유 서술 (선택, 500자)</span>
      <textarea name="note" rows="3" maxlength="500"></textarea>
    </label>
  </fieldset>

  <button id="go">컴파일</button>
</form>

<h2>결과 Spec</h2>
<pre id="out">설문을 제출하세요.</pre>

<h2>백테스트 리포트</h2>
<div id="chart"></div>
<pre id="bt">Spec 이 생성되면 자동으로 실행됩니다. (초기자본 1천만원 · 최근 5년)</pre>

<script>
const form = document.getElementById('survey');
const btn = document.getElementById('go');
const out = document.getElementById('out');
const bt = document.getElementById('bt');
const chart = document.getElementById('chart');

// 경과 초를 찍어 주는 진행 표시. 컴파일도 백테스트도 수 초~수십 초 걸려
// 표시가 없으면 멈춘 걸로 보인다. 반환값을 clearInterval 로 꺼야 한다.
function progress(el, label) {
  const t0 = Date.now();
  return setInterval(() => {
    el.textContent = `${label}... ${Math.round((Date.now() - t0) / 1000)}초`;
  }, 200);
}

// plotly.js 는 4.5MB 라 페이지를 열 때가 아니라 첫 백테스트가 끝난 뒤에 받는다.
// 설문만 보는 사람이 차트 라이브러리를 받을 이유가 없다.
// 서버(/plotly.js)가 직접 내려주므로 CDN 없이 오프라인에서도 그려진다.
let plotlyLoading = null;
function loadPlotly() {
  if (!plotlyLoading) {
    plotlyLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '/plotly.js';
      s.onload = resolve;
      // 실패하면 다음 시도에서 다시 받도록 캐시된 Promise 를 비운다.
      s.onerror = () => { plotlyLoading = null; reject(new Error('/plotly.js 로드 실패')); };
      document.head.appendChild(s);
    });
  }
  return plotlyLoading;
}

// 서버가 만든 plotly figure 를 그대로 그린다.
// 배경/글자색만 페이지에 맞춰 덮어써서 다크 모드에서도 읽힌다.
async function drawChart(fig) {
  await loadPlotly();
  const layout = Object.assign({}, fig.layout, {
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: Object.assign({}, fig.layout.font, { color: getComputedStyle(document.body).color }),
    margin: { t: 30, r: 20, b: 40, l: 60 },
    height: 560,
  });
  Plotly.newPlot(chart, fig.data, layout, { responsive: true, displaylogo: false });
}

// 생성된 Spec 을 그대로 백테스트에 태운다.
// 컴파일과 분리된 별도 요청이라, 백테스트가 실패해도 Spec 결과는 그대로 남는다.
async function runBacktest(specId) {
  bt.className = '';
  const tick = progress(bt, '백테스트 중');
  try {
    const res = await fetch(`/backtest/${specId}`, { method: 'POST' });
    const data = await res.json();
    clearInterval(tick);
    if (!res.ok) {
      bt.className = 'err';
      bt.textContent = `${res.status} 실패\n\n` + JSON.stringify(data.detail, null, 2);
    } else {
      bt.textContent = data.report;   // 서버가 만든 텍스트 리포트를 그대로 렌더
      // 차트 실패가 리포트까지 날리면 안 된다. 텍스트를 먼저 띄우고 따로 감싼다.
      try { await drawChart(data.chart); }
      catch (e) { chart.textContent = '차트를 불러오지 못했습니다: ' + e.message; }
    }
  } catch (err) {
    clearInterval(tick);
    bt.className = 'err';
    bt.textContent = String(err);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(form));
  body.max_loss = Number(body.max_loss);

  btn.disabled = true;
  out.className = '';
  bt.className = '';
  bt.textContent = 'Spec 생성 대기 중...';   // 이전 실행 결과를 지운다
  if (window.Plotly) Plotly.purge(chart);   // 이전 차트 정리
  chart.innerHTML = '';
  // 로컬 8B라 30~60초 걸린다. 진행 표시가 없으면 멈춘 걸로 보임.
  const tick = progress(out, '컴파일 중');

  try {
    const res = await fetch('/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    clearInterval(tick);
    if (!res.ok) {
      out.className = 'err';
      out.textContent = `${res.status} 거부됨\n\n` + JSON.stringify(data.detail, null, 2);
      bt.textContent = 'Spec 이 생성되지 않아 백테스트를 건너뜁니다.';
    } else {
      out.textContent = JSON.stringify(data.spec, null, 2);
      await runBacktest(data.spec_id);   // Spec 이 나왔으면 이어서 백테스트
    }
  } catch (err) {
    clearInterval(tick);
    out.className = 'err';
    out.textContent = String(err);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
